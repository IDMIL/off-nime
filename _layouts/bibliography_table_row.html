<td>{{ entry.year }}</td>
<td>{{ entry.author }}</td>
<td>{{ entry.title }}</td>
<td>{{ entry.journal | default: entry.booktitle }}</td>
<td>{{ entry.pages }}</td>
<td>
    {% if entry.url %}
        <a href="{{ entry.url }}">Link</a>
    {% endif %}
</td>
<td><button onclick="copyBibtex(`{{ entry.bibtex | escape }}`)">Copy BibTeX to Clipboard</button></td>
